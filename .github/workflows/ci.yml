name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # All three platforms, because platform-specific code (`cfg(windows)` PID
      # probing, handle inheritance) only compiles where it is used.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  # The project targets Windows, macOS and Linux, but "Linux" is a family: a
  # build that compiles on Ubuntu can still fail on Fedora, where the same
  # libraries have different names and versions and SELinux is enforcing. This
  # job compiles and tests inside a Fedora container so the RPM-family build is
  # checked on every change instead of on release day. The dependency list here
  # is the same one README's "从源码" section documents.
  fedora:
    name: fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    # Container jobs set HOME=/github/home while the process runs as root, and
    # rustup refuses to install when the two disagree ("$HOME differs from
    # euid-obtained home directory"). Pointing HOME at root's real home fixes it
    # and keeps the cargo cache where rust-cache expects it.
    env:
      HOME: /root
    steps:
      # Before checkout: the checkout action shells out to git, and the bare
      # Fedora image does not carry it.
      - name: Install Fedora dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git tar curl file pkgconf-pkg-config \
            webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The desktop shell is a separate workspace and needs the webview
      # toolchain; compiling it is what proves the GUI has what Fedora packages
      # call the same libraries.
      - name: Check the desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

  # The desktop shell lives in its own workspace, so it is checked separately.
  # A failure here means the GUI is broken, not the library.
  shell:
    name: tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

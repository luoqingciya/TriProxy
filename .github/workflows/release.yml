#
# Release pipeline.
#
# There is exactly one kind of artifact: a desktop installer. The command-line
# tool is bundled inside it rather than published separately — users were
# downloading archives that contained only a CLI and reasonably concluding the
# project had no application at all.
#
# Two variants:
#   lite — GUI + CLI, cores downloaded on first run
#   full — GUI + CLI + three verified cores, works offline
#
# Windows only for now. macOS and Linux need platform-specific work before they
# can ship: on macOS the bundle resources live in Contents/Resources rather than
# beside the executable, which breaks the single-folder data layout this build
# relies on. Shipping a desktop package that cannot find its own data would be
# worse than shipping nothing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop (windows, lite + full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The installer bundles the CLI, so it has to exist before bundling.
      - name: Build the CLI
        run: cargo build --release -p triproxy-cli

      - name: Stage the CLI as a bundle resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          cp target/release/triproxy.exe src-tauri/resources/triproxy.exe
          ls -l src-tauri/resources/

      - name: Build the lite installer
        run: npx tauri build --bundles nsis

      - name: Collect the lite installer
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe \
             "dist/TriProxy_${version}_x64-setup-lite.exe"
          # Clear the bundle directory so the full build cannot be collected
          # under the lite name.
          rm -rf src-tauri/target/release/bundle
          ls -l dist/

      # Cores are fetched through TriProxy's own verified download path, so the
      # SHA256 recorded alongside them matches the upstream release.
      - name: Stage the cores
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/core-stage"
          for core in mihomo sing-box xray; do
            ./target/release/triproxy.exe core install "$core" --data-dir "$stage"
          done
          mkdir -p src-tauri/resources/cores
          cp "$stage"/bin/*.exe "$stage"/bin/*.dat src-tauri/resources/cores/
          cp "$stage"/bin/*.json src-tauri/resources/cores/ 2>/dev/null || true
          ls -l src-tauri/resources/cores/

      # The full bundle ships third-party binaries, so their licence texts have
      # to travel with them.
      - name: Fetch upstream licence texts for the bundled cores
        shell: bash
        run: |
          set -euo pipefail
          cores="src-tauri/resources/cores"

          fetch_license() {
            local repo="$1" tag="$2" out="$3" name
            for name in LICENSE LICENSE.txt LICENSE.md COPYING COPYING.txt; do
              if curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
                   "https://raw.githubusercontent.com/$repo/$tag/$name" -o "$out" \
                 && [ -s "$out" ] && ! grep -q '^404: Not Found' "$out"; then
                echo "  got $repo/$name at $tag"
                return 0
              fi
            done
            return 1
          }

          for core in mihomo sing-box xray; do
            case "$core" in
              mihomo)   repo="MetaCubeX/mihomo" ;;
              sing-box) repo="SagerNet/sing-box" ;;
              xray)     repo="XTLS/Xray-core" ;;
            esac
            tag=$(jq -r '.tag' "$cores/$core.json")
            out="$cores/LICENSE-$core.txt"

            echo "--- $core ($repo@$tag) ---"
            if ! fetch_license "$repo" "$tag" "$out"; then
              echo "::error::no licence text found for $core at $tag; refusing to ship an unlicensed binary"
              exit 1
            fi
            size=$(wc -c < "$out")
            if [ "$size" -lt 200 ] || grep -qiE '<!DOCTYPE|<html' "$out"; then
              echo "::error::licence text for $core looks invalid ($size bytes)"
              exit 1
            fi
            echo "  $size bytes"
          done

          cp LICENSE "$cores/LICENSE-GPL-3.0.txt"

      - name: Generate third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cores="src-tauri/resources/cores"
          out="$cores/THIRD-PARTY-NOTICES.txt"

          {
            echo "TriProxy — bundled third-party proxy cores"
            echo
            echo "This build of TriProxy ships the proxy cores listed below. They are"
            echo "independent works, distributed under their own licences. The full"
            echo "licence text for each is bundled next to it as LICENSE-<core>.txt."
            echo
            for core in mihomo sing-box xray; do
              case "$core" in
                mihomo)   repo="MetaCubeX/mihomo";  lic="GPL-3.0" ;;
                sing-box) repo="SagerNet/sing-box"; lic="GPL-3.0-or-later" ;;
                xray)     repo="XTLS/Xray-core";    lic="MPL-2.0" ;;
              esac
              tag=$(jq -r '.tag' "$cores/$core.json")
              sha=$(jq -r '.sha256' "$cores/$core.json")
              echo "$core"
              echo "  version:  $tag"
              echo "  licence:  $lic"
              echo "  source:   https://github.com/$repo/tree/$tag"
              echo "  sha256:   $sha"
              echo
            done
            echo "The GNU GPL v3 full text is included as LICENSE-GPL-3.0.txt."
          } > "$out"

          cat "$out"

      - name: Build the full installer
        shell: bash
        run: |
          set -euo pipefail
          npx tauri build --bundles nsis \
            --config '{"bundle":{"resources":{"resources/triproxy.exe":"triproxy.exe","resources/cores":"cores"}}}'
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/bundle/nsis/*.exe \
             "dist/TriProxy_${version}_x64-setup-full.exe"
          ls -l dist/

      - name: Verify both variants were produced
        shell: bash
        run: |
          set -euo pipefail
          lite=$(stat -c%s dist/*-lite.exe)
          full=$(stat -c%s dist/*-full.exe)
          echo "lite=$lite full=$full"
          # The full build carries ~180 MB of cores. Equal sizes would mean the
          # resource override silently did nothing.
          test "$full" -gt "$lite"

      - uses: actions/upload-artifact@v4
        with:
          name: triproxy-desktop-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: publish release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TriProxy ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md

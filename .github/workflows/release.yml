#
# Release pipeline.
#
# One kind of artifact: a desktop installer. The command-line tool is bundled
# inside it rather than published separately — users were downloading archives
# that contained only a CLI and reasonably concluding the project had no
# application at all.
#
# Two variants per platform:
#   lite — GUI + CLI, cores downloaded on first run
#   full — GUI + CLI + three verified cores, works offline
#
# Platform differences this pipeline has to absorb:
#   - the CLI binary is triproxy.exe on Windows, triproxy elsewhere
#   - bundle formats differ (nsis / dmg / AppImage + deb + rpm)
#   - Linux needs webkit and packaging dependencies installed first
#
# Linux ships three formats on purpose. `.deb` covers Debian/Ubuntu, `.rpm`
# covers Fedora and the rest of the RHEL family — where a `.deb` is not
# installable at all and an AppImage needs FUSE 2 to be present — and AppImage
# stays because it is the only Linux format the updater can replace.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `label` and `arch` are not just job labels: they are the two fields
        # that go into every artifact name. One vocabulary for the whole
        # matrix — `x64` everywhere, `arm64` for Apple Silicon — so a download
        # never needs a decoder ring to say which machine it runs on.
        include:
          - label: windows
            os: windows-latest
            cli: triproxy.exe
            bundles: nsis
            arch: x64
          - label: linux
            os: ubuntu-latest
            cli: triproxy
            bundles: appimage,deb,rpm
            arch: x64
          - label: macos
            os: macos-latest
            cli: triproxy
            # app stays in the bundle directory so the verification step can
            # look inside it; dmg alone deletes it after packaging.
            bundles: app,dmg
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # `rpm` is only needed to inspect the built package (rpm -qlp / -qpR
          # in the verification step): tauri writes the RPM itself with the
          # pure-Rust `rpm` crate, so no rpmbuild is involved.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The installer bundles the CLI, so it has to exist before bundling.
      - name: Build the CLI
        run: cargo build --release -p triproxy-cli

      - name: Stage the CLI as a bundle resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          cp "target/release/${{ matrix.cli }}" "src-tauri/resources/${{ matrix.cli }}"
          ls -l src-tauri/resources/
          # The resource is passed to `tauri build` on the command line rather
          # than declared in tauri.conf.json: it only exists during a release
          # build, and declaring it statically broke every `cargo check` in CI.
          # That means nothing enforces its presence except this assertion.
          size=$(stat -c%s "src-tauri/resources/${{ matrix.cli }}" 2>/dev/null \
                 || stat -f%z "src-tauri/resources/${{ matrix.cli }}")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::staged CLI looks wrong ($size bytes); the installer would ship without it"
            exit 1
          fi

      - name: Build the lite installer
        shell: bash
        env:
          # Produces the .sig files the updater verifies payloads against.
          # Without this the release still builds, but no installed copy can
          # accept the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "${{ matrix.label }}" == "linux" && "$version" == *-* ]]; then
            rpm_version="${version%%-*}"
            pre="${version#*-}"
            rpm_release="0.${pre//[^0-9A-Za-z.]/}"
            npx tauri build --bundles "appimage,deb" \
              --config "{\"bundle\":{\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\"}}}"
            npx tauri bundle --bundles rpm \
              --config "{\"version\":\"${rpm_version}\",\"bundle\":{\"linux\":{\"rpm\":{\"release\":\"${rpm_release}\"}},\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\"}}}"
          else
            npx tauri build --bundles "${{ matrix.bundles }}" \
              --config "{\"bundle\":{\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\"}}}"
          fi

      - name: Collect the lite bundle
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p artifacts

          # Copy the payload and its signature together. A renamed payload with
          # the signature left behind would produce a latest.json entry that
          # every client rejects.
          keep() {
            cp "$1" "artifacts/$2"
            if [ -f "$1.sig" ]; then cp "$1.sig" "artifacts/$2.sig"; fi
          }

          # Names carry platform, architecture and variant, in that order:
          #   TriProxy-<version>-<os>-<arch>-<variant>.<ext>
          # `TriProxy_0.2.3_x64-lite.exe` said neither which OS nor which
          # architecture — "x64" only meant Windows because we said so.
          # Keep in sync with .github/scripts/latest-json.mjs.
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/*/*; do
            [ -f "$f" ] || continue
            case "$f" in
              */nsis/*.exe)        keep "$f" "TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-lite.exe" ;;
              */dmg/*.dmg)         keep "$f" "TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-lite.dmg" ;;
              */appimage/*.AppImage) keep "$f" "TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-lite.AppImage" ;;
              */deb/*.deb)         keep "$f" "TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-lite.deb" ;;
              */rpm/*.rpm)         keep "$f" "TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-lite.rpm" ;;
              # macOS update payload: the updater replaces the .app bundle from
              # this tarball, not from the dmg.
              */macos/*.app.tar.gz) keep "$f" "TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-lite.app.tar.gz" ;;
            esac
          done
          # Clear the bundle directory so the full build cannot be collected
          # under the lite name.
          rm -rf src-tauri/target/release/bundle
          ls -l artifacts/

      # Cores are fetched through TriProxy's own verified download path, so the
      # SHA256 recorded alongside them matches the upstream release.
      - name: Stage the cores
        shell: bash
        env:
          # Unauthenticated GitHub API calls are limited to 60 per hour per IP,
          # and a shared runner IP runs out fast: the Windows job failed with
          # 403 halfway through downloading the third core.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/core-stage"
          for core in mihomo sing-box xray; do
            "./target/release/${{ matrix.cli }}" core install "$core" --data-dir "$stage"
          done
          mkdir -p src-tauri/resources/cores
          # Copy everything: the binaries are triproxy.exe-style on Windows but
          # plain `mihomo` / `sing-box` / `xray` elsewhere. Matching `*.exe`
          # staged nothing on macOS and Linux, and the `|| true` that used to be
          # here hid it — both platforms shipped a "full" bundle with no cores.
          cp "$stage"/bin/* src-tauri/resources/cores/
          ls -l src-tauri/resources/cores/
          # Assert the three binaries are really there before building.
          for core in mihomo sing-box xray; do
            if ! ls src-tauri/resources/cores/ | grep -qE "^${core}(\.exe)?$"; then
              echo "::error::$core was not staged into the bundle"
              exit 1
            fi
          done

      # The full bundle ships third-party binaries, so their licence texts have
      # to travel with them.
      - name: Fetch upstream licence texts for the bundled cores
        shell: bash
        run: |
          set -euo pipefail
          cores="src-tauri/resources/cores"

          fetch_license() {
            local repo="$1" tag="$2" out="$3" name
            for name in LICENSE LICENSE.txt LICENSE.md COPYING COPYING.txt; do
              if curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
                   "https://raw.githubusercontent.com/$repo/$tag/$name" -o "$out" \
                 && [ -s "$out" ] && ! grep -q '^404: Not Found' "$out"; then
                echo "  got $repo/$name at $tag"
                return 0
              fi
            done
            return 1
          }

          for core in mihomo sing-box xray; do
            case "$core" in
              mihomo)   repo="MetaCubeX/mihomo" ;;
              sing-box) repo="SagerNet/sing-box" ;;
              xray)     repo="XTLS/Xray-core" ;;
            esac
            tag=$(jq -r '.tag' "$cores/$core.json")
            out="$cores/LICENSE-$core.txt"

            echo "--- $core ($repo@$tag) ---"
            if ! fetch_license "$repo" "$tag" "$out"; then
              echo "::error::no licence text found for $core at $tag; refusing to ship an unlicensed binary"
              exit 1
            fi
            size=$(wc -c < "$out")
            if [ "$size" -lt 200 ] || grep -qiE '<!DOCTYPE|<html' "$out"; then
              echo "::error::licence text for $core looks invalid ($size bytes)"
              exit 1
            fi
            echo "  $size bytes"
          done

          cp LICENSE "$cores/LICENSE-GPL-3.0.txt"

      - name: Generate third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cores="src-tauri/resources/cores"
          out="$cores/THIRD-PARTY-NOTICES.txt"

          {
            echo "TriProxy — bundled third-party proxy cores"
            echo
            echo "This build of TriProxy ships the proxy cores listed below. They are"
            echo "independent works, distributed under their own licences. The full"
            echo "licence text for each is bundled next to it as LICENSE-<core>.txt."
            echo
            for core in mihomo sing-box xray; do
              case "$core" in
                mihomo)   repo="MetaCubeX/mihomo";  lic="GPL-3.0" ;;
                sing-box) repo="SagerNet/sing-box"; lic="GPL-3.0-or-later" ;;
                xray)     repo="XTLS/Xray-core";    lic="MPL-2.0" ;;
              esac
              tag=$(jq -r '.tag' "$cores/$core.json")
              sha=$(jq -r '.sha256' "$cores/$core.json")
              echo "$core"
              echo "  version:  $tag"
              echo "  licence:  $lic"
              echo "  source:   https://github.com/$repo/tree/$tag"
              echo "  sha256:   $sha"
              echo
            done
            echo "The GNU GPL v3 full text is included as LICENSE-GPL-3.0.txt."
          } > "$out"

          cat "$out"

      - name: Build the full installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "${{ matrix.label }}" == "linux" && "$version" == *-* ]]; then
            rpm_version="${version%%-*}"
            pre="${version#*-}"
            rpm_release="0.${pre//[^0-9A-Za-z.]/}"
            npx tauri build --bundles "appimage,deb" \
              --config "{\"bundle\":{\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\",\"resources/cores/*\":\"cores/\"}}}"
            npx tauri bundle --bundles rpm \
              --config "{\"version\":\"${rpm_version}\",\"bundle\":{\"linux\":{\"rpm\":{\"release\":\"${rpm_release}\"}},\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\",\"resources/cores/*\":\"cores/\"}}}"
          else
            npx tauri build --bundles "${{ matrix.bundles }}" \
              --config "{\"bundle\":{\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\",\"resources/cores/*\":\"cores/\"}}}"
          fi
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/*/*; do
            [ -f "$f" ] || continue
            case "$f" in
              */nsis/*.exe)  cp "$f" "artifacts/TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-full.exe" ;;
              */dmg/*.dmg)   cp "$f" "artifacts/TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-full.dmg" ;;
              */appimage/*.AppImage) cp "$f" "artifacts/TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-full.AppImage" ;;
              */deb/*.deb)   cp "$f" "artifacts/TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-full.deb" ;;
              */rpm/*.rpm)   cp "$f" "artifacts/TriProxy-${version}-${{ matrix.label }}-${{ matrix.arch }}-full.rpm" ;;
            esac
          done
          ls -l artifacts/

      # Check the payload itself, not just its size. A full build that silently
      # omitted the cores still passes a size comparison; looking for the files
      # does not. The search is path-agnostic on purpose — each platform puts
      # resources somewhere different, and the first version of this check
      # hard-coded a macOS path that did not exist, which told us the resources
      # were missing rather than where they landed.
      - name: Verify the cores are inside the bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/release/bundle"
          echo "--- bundle tree ---"
          find "$bundle" -maxdepth 4 -name '*xray*' -o -maxdepth 4 -name '*geosite*' | head -20

          case "${{ matrix.label }}" in
            windows)
              nsi=$(find src-tauri/target/release/nsis -name 'installer.nsi' | head -1)
              grep -q 'cores\\xray.exe' "$nsi"
              echo "installer script lists the cores"
              ;;
            *)
              found_core=$(find "$bundle" -name 'xray' -o -name 'xray.exe' | head -1)
              found_data=$(find "$bundle" -name 'geosite.dat' | head -1)
              if [ -z "$found_core" ] || [ -z "$found_data" ]; then
                echo "::error::cores are not in the bundle (core='$found_core' data='$found_data')"
                find "$bundle" -maxdepth 3 | head -40
                exit 1
              fi
              echo "cores present: $found_core"
              ;;
          esac

      # The RPM is written by the pure-Rust `rpm` crate, not `rpmbuild`, and its
      # requirement list is `bundle.linux.rpm.depends` plus a handful of sonames
      # tauri-cli appends from a hard-coded table (webkit2gtk 4.1, GTK 3, and —
      # with the tray-icon feature — appindicator3). Nothing inspects the binary,
      # so a typo in a declared package name yields a package `dnf` refuses with
      # "nothing provides webkit2gtk4.1", and nothing else in the pipeline would
      # notice. Fedora users would find out at install time.
      - name: Verify the RPM payload and its dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          full=$(ls artifacts/*-full.rpm | head -1)
          lite=$(ls artifacts/*-lite.rpm | head -1)

          echo "--- $full: bundled cores ---"
          payload=$(rpm -qlp "$full")
          for core in mihomo sing-box xray; do
            printf '%s\n' "$payload" | grep -qE "/cores/${core}$" \
              || { echo "::error::$core is missing from the RPM payload"; exit 1; }
          done
          printf '%s\n' "$payload" | grep -qE '/cores/THIRD-PARTY-NOTICES.txt$' \
            || { echo "::error::the RPM ships cores without their notices"; exit 1; }
          printf '%s\n' "$payload" | grep -qE '^/usr/bin/' \
            || { echo "::error::the RPM installs no binary under /usr/bin"; exit 1; }

          echo "--- $lite: must not carry cores ---"
          if rpm -qlp "$lite" | grep -qE '/cores/'; then
            echo "::error::the lite RPM carries cores"
            exit 1
          fi

          echo "--- declared requirements ---"
          requires=$(rpm -qpR "$full")
          printf '%s\n' "$requires"
          for pkg in webkit2gtk4.1 gtk3 libappindicator-gtk3; do
            printf '%s\n' "$requires" | grep -qx "$pkg" \
              || { echo "::error::the RPM does not require $pkg"; exit 1; }
          done

      - name: Verify both variants were produced
        shell: bash
        run: |
          set -euo pipefail
          lite=$(ls artifacts/*-lite.* | head -1)
          full=$(ls artifacts/*-full.* | head -1)
          lite_size=$(stat -c%s "$lite" 2>/dev/null || stat -f%z "$lite")
          full_size=$(stat -c%s "$full" 2>/dev/null || stat -f%z "$full")
          echo "$lite=$lite_size  $full=$full_size"
          # The payload check above is the authoritative one; this only catches
          # the degenerate case where both variants are the same file. A fixed
          # multiplier does not work across platforms — the Linux lite AppImage
          # is already 90 MB, so requiring 2x rejected a bundle that did contain
          # the cores.
          if [ "$full_size" -le "$lite_size" ]; then
            echo "::error::full ($full_size) is not larger than lite ($lite_size); the cores are missing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: triproxy-desktop-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: publish release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble latest.json for the updater
        run: |
          set -euo pipefail
          node .github/scripts/latest-json.mjs \
            artifacts "${GITHUB_REF_NAME#v}" "${GITHUB_REPOSITORY}" artifacts/latest.json
          cat artifacts/latest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l artifacts
          extra=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TriProxy ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md \
            "${extra[@]}"

#
# Release pipeline.
#
# One kind of artifact: a desktop installer. The command-line tool is bundled
# inside it rather than published separately — users were downloading archives
# that contained only a CLI and reasonably concluding the project had no
# application at all.
#
# Two variants per platform:
#   lite — GUI + CLI, cores downloaded on first run
#   full — GUI + CLI + three verified cores, works offline
#
# Platform differences this pipeline has to absorb:
#   - the CLI binary is triproxy.exe on Windows, triproxy elsewhere
#   - bundle formats differ (nsis / dmg / AppImage + deb)
#   - Linux needs webkit and packaging dependencies installed first

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            cli: triproxy.exe
            bundles: nsis
            arch: x64
          - label: linux
            os: ubuntu-latest
            cli: triproxy
            bundles: appimage,deb
            arch: amd64
          - label: macos
            os: macos-latest
            cli: triproxy
            # app stays in the bundle directory so the verification step can
            # look inside it; dmg alone deletes it after packaging.
            bundles: app,dmg
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The installer bundles the CLI, so it has to exist before bundling.
      - name: Build the CLI
        run: cargo build --release -p triproxy-cli

      - name: Stage the CLI as a bundle resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          cp "target/release/${{ matrix.cli }}" "src-tauri/resources/${{ matrix.cli }}"
          ls -l src-tauri/resources/
          # The resource is passed to `tauri build` on the command line rather
          # than declared in tauri.conf.json: it only exists during a release
          # build, and declaring it statically broke every `cargo check` in CI.
          # That means nothing enforces its presence except this assertion.
          size=$(stat -c%s "src-tauri/resources/${{ matrix.cli }}" 2>/dev/null \
                 || stat -f%z "src-tauri/resources/${{ matrix.cli }}")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::staged CLI looks wrong ($size bytes); the installer would ship without it"
            exit 1
          fi

      - name: Build the lite installer
        shell: bash
        run: |
          set -euo pipefail
          npx tauri build --bundles "${{ matrix.bundles }}" \
            --config "{\"bundle\":{\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\"}}}"

      - name: Collect the lite bundle
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p artifacts
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/*/*; do
            [ -f "$f" ] || continue
            case "$f" in
              */nsis/*.exe)  cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-lite.exe" ;;
              */dmg/*.dmg)   cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-lite.dmg" ;;
              */appimage/*)  cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-lite.AppImage" ;;
              */deb/*.deb)   cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-lite.deb" ;;
            esac
          done
          # Clear the bundle directory so the full build cannot be collected
          # under the lite name.
          rm -rf src-tauri/target/release/bundle
          ls -l artifacts/

      # Cores are fetched through TriProxy's own verified download path, so the
      # SHA256 recorded alongside them matches the upstream release.
      - name: Stage the cores
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/core-stage"
          for core in mihomo sing-box xray; do
            "./target/release/${{ matrix.cli }}" core install "$core" --data-dir "$stage"
          done
          mkdir -p src-tauri/resources/cores
          # Copy everything: the binaries are triproxy.exe-style on Windows but
          # plain `mihomo` / `sing-box` / `xray` elsewhere. Matching `*.exe`
          # staged nothing on macOS and Linux, and the `|| true` that used to be
          # here hid it — both platforms shipped a "full" bundle with no cores.
          cp "$stage"/bin/* src-tauri/resources/cores/
          ls -l src-tauri/resources/cores/
          # Assert the three binaries are really there before building.
          for core in mihomo sing-box xray; do
            if ! ls src-tauri/resources/cores/ | grep -qE "^${core}(\.exe)?$"; then
              echo "::error::$core was not staged into the bundle"
              exit 1
            fi
          done

      # The full bundle ships third-party binaries, so their licence texts have
      # to travel with them.
      - name: Fetch upstream licence texts for the bundled cores
        shell: bash
        run: |
          set -euo pipefail
          cores="src-tauri/resources/cores"

          fetch_license() {
            local repo="$1" tag="$2" out="$3" name
            for name in LICENSE LICENSE.txt LICENSE.md COPYING COPYING.txt; do
              if curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
                   "https://raw.githubusercontent.com/$repo/$tag/$name" -o "$out" \
                 && [ -s "$out" ] && ! grep -q '^404: Not Found' "$out"; then
                echo "  got $repo/$name at $tag"
                return 0
              fi
            done
            return 1
          }

          for core in mihomo sing-box xray; do
            case "$core" in
              mihomo)   repo="MetaCubeX/mihomo" ;;
              sing-box) repo="SagerNet/sing-box" ;;
              xray)     repo="XTLS/Xray-core" ;;
            esac
            tag=$(jq -r '.tag' "$cores/$core.json")
            out="$cores/LICENSE-$core.txt"

            echo "--- $core ($repo@$tag) ---"
            if ! fetch_license "$repo" "$tag" "$out"; then
              echo "::error::no licence text found for $core at $tag; refusing to ship an unlicensed binary"
              exit 1
            fi
            size=$(wc -c < "$out")
            if [ "$size" -lt 200 ] || grep -qiE '<!DOCTYPE|<html' "$out"; then
              echo "::error::licence text for $core looks invalid ($size bytes)"
              exit 1
            fi
            echo "  $size bytes"
          done

          cp LICENSE "$cores/LICENSE-GPL-3.0.txt"

      - name: Generate third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cores="src-tauri/resources/cores"
          out="$cores/THIRD-PARTY-NOTICES.txt"

          {
            echo "TriProxy — bundled third-party proxy cores"
            echo
            echo "This build of TriProxy ships the proxy cores listed below. They are"
            echo "independent works, distributed under their own licences. The full"
            echo "licence text for each is bundled next to it as LICENSE-<core>.txt."
            echo
            for core in mihomo sing-box xray; do
              case "$core" in
                mihomo)   repo="MetaCubeX/mihomo";  lic="GPL-3.0" ;;
                sing-box) repo="SagerNet/sing-box"; lic="GPL-3.0-or-later" ;;
                xray)     repo="XTLS/Xray-core";    lic="MPL-2.0" ;;
              esac
              tag=$(jq -r '.tag' "$cores/$core.json")
              sha=$(jq -r '.sha256' "$cores/$core.json")
              echo "$core"
              echo "  version:  $tag"
              echo "  licence:  $lic"
              echo "  source:   https://github.com/$repo/tree/$tag"
              echo "  sha256:   $sha"
              echo
            done
            echo "The GNU GPL v3 full text is included as LICENSE-GPL-3.0.txt."
          } > "$out"

          cat "$out"

      - name: Build the full installer
        shell: bash
        run: |
          set -euo pipefail
          npx tauri build --bundles "${{ matrix.bundles }}" \
            --config "{\"bundle\":{\"resources\":{\"resources/${{ matrix.cli }}\":\"${{ matrix.cli }}\",\"resources/cores/*\":\"cores/\"}}}"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/*/*; do
            [ -f "$f" ] || continue
            case "$f" in
              */nsis/*.exe)  cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-full.exe" ;;
              */dmg/*.dmg)   cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-full.dmg" ;;
              */appimage/*)  cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-full.AppImage" ;;
              */deb/*.deb)   cp "$f" "artifacts/TriProxy_${version}_${{ matrix.arch }}-full.deb" ;;
            esac
          done
          ls -l artifacts/

      # Check the payload itself, not just its size. A full build that silently
      # omitted the cores still passes a size comparison; looking for the files
      # does not. The search is path-agnostic on purpose — each platform puts
      # resources somewhere different, and the first version of this check
      # hard-coded a macOS path that did not exist, which told us the resources
      # were missing rather than where they landed.
      - name: Verify the cores are inside the bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/release/bundle"
          echo "--- bundle tree ---"
          find "$bundle" -maxdepth 4 -name '*xray*' -o -maxdepth 4 -name '*geosite*' | head -20

          case "${{ matrix.label }}" in
            windows)
              nsi=$(find src-tauri/target/release/nsis -name 'installer.nsi' | head -1)
              grep -q 'cores\\xray.exe' "$nsi"
              echo "installer script lists the cores"
              ;;
            *)
              found_core=$(find "$bundle" -name 'xray' -o -name 'xray.exe' | head -1)
              found_data=$(find "$bundle" -name 'geosite.dat' | head -1)
              if [ -z "$found_core" ] || [ -z "$found_data" ]; then
                echo "::error::cores are not in the bundle (core='$found_core' data='$found_data')"
                find "$bundle" -maxdepth 3 | head -40
                exit 1
              fi
              echo "cores present: $found_core"
              ;;
          esac

      - name: Verify both variants were produced
        shell: bash
        run: |
          set -euo pipefail
          lite=$(ls artifacts/*-lite.* | head -1)
          full=$(ls artifacts/*-full.* | head -1)
          lite_size=$(stat -c%s "$lite" 2>/dev/null || stat -f%z "$lite")
          full_size=$(stat -c%s "$full" 2>/dev/null || stat -f%z "$full")
          echo "$lite=$lite_size  $full=$full_size"
          # The full build carries ~180 MB of cores. Requiring it to be at least
          # twice the lite size catches a resource override that did nothing —
          # a plain "greater than" passed a macOS build whose dmg was 13 MB
          # against 9 MB, with no cores in it at all.
          if [ "$full_size" -lt $((lite_size * 2)) ]; then
            echo "::error::full ($full_size) is not meaningfully larger than lite ($lite_size); the cores are probably missing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: triproxy-desktop-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: publish release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TriProxy ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md

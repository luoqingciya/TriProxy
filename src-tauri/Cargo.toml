[package]
name = "triproxy-app"
version = "0.2.4"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
authors = ["luoqingci"]
description = "TriProxy desktop shell (Tauri)"

# Standalone workspace on purpose: the GUI needs platform webview toolchains that
# the library/CLI workspace must not require, so `cargo test --all` at the root
# stays fast and CI does not need WebKitGTK or WebView2 to run unit tests.
[workspace]

[lib]
name = "triproxy_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
triproxy-core = { path = "../crates/triproxy-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
